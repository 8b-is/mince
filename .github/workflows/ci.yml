name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: CGO_ENABLED=0 go test -race ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/mince ./cmd/mince

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path tools/mlx-quant-kompress/Cargo.toml
      - run: cargo build --release --manifest-path tools/mlx-quant-kompress/Cargo.toml
