services:
  mince:
    build: .
    command: ["proxy", "--config", "/config/mince.vkd.hcl", "--addr", "0.0.0.0:8787"]
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - mince-ccr:/var/cache/mince/ccr

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.34.1
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SWAGGER_JSON: /openapi.yaml
    volumes:
      - ./api/openapi.yaml:/openapi.yaml:ro

volumes:
  mince-ccr:
